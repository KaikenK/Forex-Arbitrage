<!--
  File reference: /mnt/data/report - DM.docx
  
  Fixed MT5 Candle Dashboard
  - Converts candle.time to seconds immediately (handles both ms and s)
  - Keeps candles in chronological order (oldest -> newest) using push()
  - Uses series.update() for real-time incremental updates
  - Uses setData() ONLY when switching symbol/interval or receiving initial batch
  - Maintains rolling 60s window (in seconds)
  - Table shows newest first (reverse of chronological order)
  - Improved error handling for ping/pong and JSON parsing
-->
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>MT5 Real-Time Candle Dashboard</title>

  <script src="https://unpkg.com/lightweight-charts@4.1.3/dist/lightweight-charts.standalone.production.js"></script>

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background:#131722; color:#d1d4dc; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif; }
    .header { padding:12px 18px; background:#1e222d; border-bottom:1px solid #2a2e39; display:flex; justify-content:space-between; align-items:center; }
    .container{max-width:1400px;margin:18px auto;padding:12px;}
    .control-panel{background:#1e222d;padding:12px;border-radius:8px;border:1px solid #2a2e39;display:flex;gap:12px;align-items:center;flex-wrap:wrap;}
    .control-panel label{color:#787b86;font-size:0.9em;}
    .control-panel select{background:#2a2e39;color:#d1d4dc;border:1px solid #363a45;padding:6px 12px;border-radius:4px;font-size:0.9em;cursor:pointer;}
    .control-panel select:hover{border-color:#2962ff;}
    .control-panel button{background:#2962ff;color:#fff;border:none;padding:8px 16px;border-radius:4px;cursor:pointer;font-size:0.9em;font-weight:500;transition:background 0.2s;}
    .control-panel button:hover:not(:disabled){background:#1e53e5;}
    .control-panel button:disabled{background:#363a45;cursor:not-allowed;opacity:0.5;}
    .control-panel button.danger{background:#f23645;}
    .control-panel button.danger:hover:not(:disabled){background:#d32f3e;}
    .status-indicator{display:flex;align-items:center;gap:8px;margin-left:auto;}
    .chart-container{margin-top:16px;background:#1e222d;padding:12px;border-radius:8px;border:1px solid #2a2e39;min-height:350px;}
    .chart-container #chart{width:100% !important;height:320px !important;min-height:320px !important;}
    .chart-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;}
    .chart-price{color:#26a69a;font-weight:700;font-size:1.2em;}
    .table-container{margin-top:12px;background:#1e222d;border-radius:8px;border:1px solid #2a2e39;padding:8px;overflow:auto}
    table{width:100%;border-collapse:collapse;color:#d1d4dc}
    th,td{padding:8px;border-bottom:1px solid #2a2e39;text-align:left}
    thead{background:#131722;position:sticky;top:0;}
    thead th{color:#787b86;font-size:12px;font-weight:600;text-transform:uppercase;}
    tbody tr:hover{background:#252936;}
    .price-up{color:#26a69a} 
    .price-down{color:#f23645}
    .direction-up{color:#26a69a;font-weight:600}
    .direction-down{color:#f23645;font-weight:600}
    .status-dot{width:10px;height:10px;border-radius:50%;display:inline-block;background:#f23645;animation:pulse 2s infinite;}
    .status-dot.connected{background:#26a69a;}
    @keyframes pulse{0%,100%{opacity:1}50%{opacity:0.5}}
  </style>
</head>
<body>
  <div class="header">
    <h2 style="color:#2962ff;margin:0">📊 MT5 Real-Time Candle Dashboard</h2>
  </div>

  <div class="container">
    <div class="control-panel">
      <label for="symbolSelect">Symbol:</label>
      <select id="symbolSelect">
        <option>EURUSD</option>
        <option>GBPUSD</option>
        <option>USDJPY</option>
      </select>

      <label for="intervalSelect">Interval:</label>
      <select id="intervalSelect">
        <option value="100ms">100ms</option>
        <option value="500ms">500ms</option>
        <option value="1s" selected>1s</option>
        <option value="5s">5s</option>
        <option value="15s">15s</option>
        <option value="1m">1m</option>
      </select>

      <button id="connectBtn">Connect</button>
      <button id="disconnectBtn" disabled>Disconnect</button>
      <button id="clearBtn">Clear</button>
      
      <div class="status-indicator">
        <div id="statusDot" class="status-dot"></div>
        <div id="statusText">Disconnected</div>
      </div>
    </div>

    <div class="chart-container">
      <div class="chart-header">
        <div><strong>Candlestick Chart (Last 60s)</strong></div>
        <div class="chart-price" id="currentPrice">-</div>
      </div>
      <div id="chart" style="width:100%;height:320px;min-height:320px;"></div>
    </div>

    <div class="table-container">
      <table>
        <thead>
          <tr>
            <th>Time</th><th>Open</th><th>High</th><th>Low</th><th>Close</th><th>Volume</th><th>VWAP</th><th>Dir</th><th>Ticks</th><th>Spread Avg</th><th>Vel</th>
          </tr>
        </thead>
        <tbody id="candleBody">
          <tr><td colspan="11" style="text-align:center;color:#787b86;padding:18px">No data — click Connect</td></tr>
        </tbody>
      </table>
    </div>
  </div>

<script>
const state = {
  ws: null,
  candles: [],           // chronological order: oldest -> newest (using push)
  series: null,
  chart: null,
  symbol: 'EURUSD',
  interval: '1s',
  connected: false,
  needsInitialSetData: false  // flag for symbol/interval switch
};

const INTERVAL_MS = {
  '100ms': 100, '500ms': 500, '1s': 1000, '5s': 5000, '15s': 15000, '1m': 60000
};

const chartEl = document.getElementById('chart');
const connectBtn = document.getElementById('connectBtn');
const disconnectBtn = document.getElementById('disconnectBtn');
const clearBtn = document.getElementById('clearBtn');
const symbolSelect = document.getElementById('symbolSelect');
const intervalSelect = document.getElementById('intervalSelect');
const statusDot = document.getElementById('statusDot');
const statusText = document.getElementById('statusText');
const currentPriceEl = document.getElementById('currentPrice');
const candleBody = document.getElementById('candleBody');

function initChart() {
  if (state.chart) return;

  state.chart = LightweightCharts.createChart(chartEl, {
    layout: {
      background: { type: 'solid', color: '#131722' },
      textColor: '#D0D4DC',
    },
    grid: {
      vertLines: { visible: true, color: '#2a2e39' },
      horzLines: { visible: true, color: '#2a2e39' }
    },
    crosshair: {
      mode: LightweightCharts.CrosshairMode.Normal,
      vertLine: { color: '#758696', width: 1, style: 2, visible: true },
      horzLine: { color: '#758696', width: 1, style: 2, visible: true }
    },
    rightPriceScale: {
      borderColor: '#2a2e39',
      scaleMargins: { top: 0.2, bottom: 0.2 },
      mode: LightweightCharts.PriceScaleMode.Normal,
    },
    timeScale: { 
      timeVisible: true, 
      secondsVisible: true, 
      rightOffset: 5, 
      borderColor: '#2a2e39',
      fixLeftEdge: false,
      fixRightEdge: false
    },
    width: chartEl.clientWidth || 800,
    height: 320
  });

  state.series = state.chart.addCandlestickSeries({
    upColor: '#26a69a', downColor: '#f23645',
    wickUpColor: '#26a69a', wickDownColor: '#f23645',
    borderVisible: false
  });

  // Add TradingView-like price formatting
  state.series.applyOptions({
    priceFormat: {
      type: 'price',
      precision: 5,
      minMove: 0.00001
    }
  });

  // Enable auto-scaling
  state.chart.timeScale().fitContent();
  state.chart.priceScale('right').applyOptions({ autoScale: true });

  if (typeof ResizeObserver !== 'undefined') {
    new ResizeObserver(() => {
      if (chartEl.clientWidth > 0) {
        state.chart.applyOptions({ width: chartEl.clientWidth });
      }
    }).observe(chartEl);
  }
}

function normalizeCandle(c) {
  let t = Number(c.time);
  if (t > 1e10) t = Math.floor(t / 1000);
  else t = Math.floor(t);
  return {
    time: t,
    open: Number(c.open),
    high: Number(c.high),
    low: Number(c.low),
    close: Number(c.close),
    volume: Number(c.volume || 0),
    vwap: (c.vwap !== null && c.vwap !== undefined) ? Number(c.vwap) : null,
    direction: c.direction || 0,
    tick_count: c.tick_count || 0,
    spread_avg: (c.spread_avg !== null && c.spread_avg !== undefined) ? Number(c.spread_avg) : null,
    velocity: (c.velocity !== null && c.velocity !== undefined) ? Number(c.velocity) : null
  };
}

function pruneToWindow() {
  const nowSec = Math.floor(Date.now() / 1000);
  const cutoff = nowSec - 60;
  state.candles = state.candles.filter(c => c.time >= cutoff);
}

function setInitialData(allCandles) {
  state.candles = allCandles.map(normalizeCandle).sort((a,b) => a.time - b.time);
  pruneToWindow();
  
  // Use setData for initial load
  if (state.series && state.chart && state.candles.length > 0) {
    const chartData = state.candles.map(c => ({
      time: c.time,
      open: Number(c.open),
      high: Number(c.high),
      low: Number(c.low),
      close: Number(c.close)
    }));
    
    try {
      state.series.setData(chartData);
      state.chart.timeScale().fitContent();
      state.chart.priceScale('right').applyOptions({ autoScale: true });
    } catch (err) {
      console.error('setData error', err);
    }
  }
  
  renderTable();
}

function updateChartData() {
  if (!state.series || !state.chart) return;
  
  const chartData = state.candles.map(c => ({
    time: c.time,
    open: Number(c.open),
    high: Number(c.high),
    low: Number(c.low),
    close: Number(c.close)
  }));
  
  if (chartData.length > 0) {
    try {
      state.series.setData(chartData);
      // Auto-scale price axis
      state.chart.timeScale().fitContent();
      state.chart.priceScale('right').applyOptions({ autoScale: true });
    } catch (err) {
      console.error('setData error', err);
    }
  }
}

function applyCandle(c) {
  // Convert candle values to numbers immediately
  const candleTime = Math.floor(Number(c.time) / 1000);
  const candleData = {
    time: candleTime,
    open: Number(c.open),
    high: Number(c.high),
    low: Number(c.low),
    close: Number(c.close)
  };
  
  // Validate OHLC data
  if (!candleData.open || !candleData.high || !candleData.low || !candleData.close || candleData.high < candleData.low) {
    console.warn('Invalid candle data:', candleData);
    return;
  }
  
  const nc = normalizeCandle(c);
  const last = state.candles.length ? state.candles[state.candles.length - 1] : null;
  const isNewCandle = !last || last.time !== candleTime;
  
  if (last && last.time === candleTime) {
    // Update existing candle
    state.candles[state.candles.length - 1] = nc;
    // Use update() for real-time updates (preserves auto-scaling)
    if (state.series) {
      try {
        state.series.update(candleData);
        state.chart.timeScale().scrollToRealTime();
      } catch (e) {
        console.warn('update() failed', e);
      }
    }
  } else if (last && candleTime <= last.time) {
    // Insert or update candle in chronological order
    const idx = state.candles.findIndex(c => c.time >= candleTime);
    if (idx >= 0 && state.candles[idx].time === candleTime) {
      state.candles[idx] = nc;
      // Update existing candle
      if (state.series) {
        try {
          state.series.update(candleData);
        } catch (e) {
          console.warn('update() failed', e);
        }
      }
    } else {
      state.candles.splice(idx < 0 ? state.candles.length : idx, 0, nc);
      state.candles.sort((a, b) => a.time - b.time);
      pruneToWindow();
      // New candle inserted - use setData for proper rendering
      updateChartData();
    }
  } else {
    // Append new candle (chronological order)
    state.candles.push(nc);
    pruneToWindow();
    // New candle - use update() for real-time performance
    if (state.series) {
      try {
        state.series.update(candleData);
        // Auto-scroll and auto-scale when new candle appears
        state.chart.timeScale().scrollToRealTime();
        state.chart.priceScale('right').applyOptions({ autoScale: true });
        state.chart.timeScale().fitContent();
      } catch (e) {
        console.warn('update() failed for new candle', e);
        // Fallback to setData if update fails
        updateChartData();
      }
    }
  }
  
  currentPriceEl.textContent = candleData.close.toFixed(5);
  renderTable();
}

function renderTable() {
  if (!state.candles.length) {
    candleBody.innerHTML = '<tr><td colspan="11" style="text-align:center;color:#787b86;padding:18px">No data yet.</td></tr>';
    return;
  }
  const rows = state.candles.slice().reverse().map(c => {
    const timeStr = new Date(c.time * 1000).toLocaleTimeString();
    const dir = (c.direction > 0) ? '↑' : '↓';
    const dirClass = (c.direction > 0) ? 'direction-up' : 'direction-down';
    const clsClose = (c.close >= c.open) ? 'price-up' : 'price-down';
    return `<tr>
      <td>${timeStr}</td>
      <td>${c.open.toFixed(5)}</td>
      <td class="price-up">${c.high.toFixed(5)}</td>
      <td class="price-down">${c.low.toFixed(5)}</td>
      <td class="${clsClose}">${c.close.toFixed(5)}</td>
      <td>${c.volume}</td>
      <td>${c.vwap ? c.vwap.toFixed(5) : 'N/A'}</td>
      <td class="${dirClass}">${dir}</td>
      <td>${c.tick_count}</td>
      <td>${c.spread_avg !== null ? Number(c.spread_avg).toFixed(5) : 'N/A'}</td>
      <td class="${c.velocity !== null && c.velocity >= 0 ? 'price-up' : 'price-down'}">${c.velocity !== null ? c.velocity.toFixed(6) : 'N/A'}</td>
    </tr>`;
  }).join('');
  candleBody.innerHTML = rows;
}

function connect() {
  if (state.connected) return;
  
  const symbol = symbolSelect.value;
  const interval = intervalSelect.value;
  
  if (state.symbol !== symbol || state.interval !== interval) {
    state.candles = [];
    state.needsInitialSetData = true;
    if (state.series) {
      try {
        state.series.setData([]);
      } catch (e) {}
    }
  }
  
  state.symbol = symbol;
  state.interval = interval;

  initChart();

  const url = `ws://localhost:8000/ws/candles/${symbol}/${interval}`;
  state.ws = new WebSocket(url);

  connectBtn.disabled = true;
  statusText.textContent = 'Connecting...';

  state.ws.onopen = () => {
    state.connected = true;
    statusDot.classList.add('connected');
    statusText.textContent = 'Connected';
    disconnectBtn.disabled = false;
    connectBtn.disabled = true;
  };

  state.ws.onmessage = (ev) => {
    if (ev.data === 'ping') {
      state.ws.send('pong');
      return;
    }
    if (ev.data === 'pong') return;

    const lines = ev.data.split('\n').map(l => l.trim()).filter(l => l && l !== 'ping' && l !== 'pong');
    for (const line of lines) {
      try {
        const msg = JSON.parse(line);
        if (msg.type === 'batch' && Array.isArray(msg.candles)) {
          const all = msg.candles.map(normalizeCandle).sort((a,b) => a.time - b.time);
          setInitialData(all);
          state.needsInitialSetData = false;
        } else if (msg.type === 'candle') {
          if (state.needsInitialSetData) {
            state.candles = [];
            state.needsInitialSetData = false;
            if (state.series) {
              try {
                state.series.setData([]);
              } catch (e) {}
            }
          }
          applyCandle(msg);
        }
      } catch (err) {
        console.error('WS: invalid JSON');
      }
    }
  };

  state.ws.onerror = (e) => {
    console.error('WebSocket error', e);
  };

  state.ws.onclose = () => {
    state.connected = false;
    statusDot.classList.remove('connected');
    statusText.textContent = 'Disconnected';
    disconnectBtn.disabled = true;
    connectBtn.disabled = false;
  };
}

function disconnect() {
  if (state.ws) {
    state.ws.close();
    state.ws = null;
  }
  state.connected = false;
  statusDot.classList.remove('connected');
  statusText.textContent = 'Disconnected';
  disconnectBtn.disabled = true;
  connectBtn.disabled = false;
}

function clearAll() {
  state.candles = [];
  if (state.series) {
    try {
      state.series.setData([]);
    } catch(e) {}
  }
  currentPriceEl.textContent = '-';
  renderTable();
}

connectBtn.addEventListener('click', connect);
disconnectBtn.addEventListener('click', disconnect);
clearBtn.addEventListener('click', clearAll);

// Auto-reconnect when interval or symbol changes while connected
intervalSelect.addEventListener('change', () => {
  if (state.connected) {
    // Disconnect and reconnect with new interval
    disconnect();
    setTimeout(() => {
      connect();
    }, 100);
  }
});

symbolSelect.addEventListener('change', () => {
  if (state.connected) {
    // Disconnect and reconnect with new symbol
    disconnect();
    setTimeout(() => {
      connect();
    }, 100);
  }
});

initChart();
</script>
</body>
</html>
